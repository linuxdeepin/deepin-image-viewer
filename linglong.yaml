version: '1'

package:
  id: org.deepin.image.viewer
  name: deepin-image-viewer
  version: 6.0.61.1
  kind: app
  description: |
    view images for deepin os.

command:
  - deepin-image-viewer

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/6.7.0

build: |
  # for linglong DBus service
  sed -i "s|Exec=/usr/bin/deepin-image-viewer|Exec=deepin-image-viewer|g" ./src/com.deepin.imageViewer.service

  # add path for searching OpenGL
  export PATH=$PATH:/runtime/include:/runtime/lib/${TRIPLET}

  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  cmake -B build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${PREFIX} \
        -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
        -DVERSION=${VERSION}
  cmake --build build -j`nproc`
  cmake --build build --target install

  # buildext.apt.depends 只合并 bin/sbin/lib 到应用层，
  # OCR 模型文件位于 /usr/share，需手动带入
  mkdir -p ${PREFIX}/share
  cp -a /usr/share/deepin-ocr-plugin-manager ${PREFIX}/share/

buildext:
  apt:
    build_depends:
      - cmake
      - libdeepin-ocr-plugin-manager-dev
      - libncnn-dev
      - libopencv-mobile-dev
      - libraw-dev
    depends:
      - kimageformat6-plugins
      - libdeepin-ocr-plugin-manager
      - libraw23
