version: '1.0'
app: deepin-image-viewer
cases:
- id: suite_ocr_001_s1
  name: OCR-点击识别文字按钮
  module: OCR
  app: deepin-image-viewer
  description: 点击工具栏识别文字按钮，验证OCR识别完成（HighlightText按钮出现）
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Extract text
    do: click
    wait: 25.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: HighlightText
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.5
- id: suite_ocr_002_s1
