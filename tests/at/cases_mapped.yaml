- id: suite_mainmenu_001_s1
  name: 主菜单-关于
  module: mainmenu
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: Title bar
    items:
    - 关于
    wait: 2.0
  - step_type: assert
    action: assert_window
  - step_type: assert
    action: assert_element
    selector:
      name: ImageViewer
