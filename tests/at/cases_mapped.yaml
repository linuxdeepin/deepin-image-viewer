version: '1.0'
cases:
- id: suite_quanping_001_s1
  name: 全屏-双击图片进入全屏
  module: quanping
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: double_click
    wait: 1.5
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageViewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_quanping_002_s1
  name: 全屏-快捷键F11进入与ESC退出全屏
  module: quanping
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 1.5
  - step_type: action
    action: keyboard_press
    key: esc
    wait: 1.5
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageViewer
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_quanping_003_s1
  name: 幻灯片-ESC退出幻灯片放映
  module: quanping
  steps:
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: esc
    wait: 1.5
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_quanping_004_s1
  name: 幻灯片-多张图片循环放映
  module: quanping
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Slide show
    wait: 2.0
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_quanping_005_s1
  name: tif多页图-播放幻灯片
  module: quanping
  steps:
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 2.0
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_daohangchuangkou_001_s1
  name: 导航窗口-缩略图切换图片
  module: daohangchuangkou
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NormalThumbnailDelegate
    do: click
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gongjulan_001_s1
  name: 图片信息-工具栏切换图片展示
  module: gongjulan
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: 下一张
    do: click
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: Loader_InformationDialog
  - step_type: assert
    action: assert_element
    selector:
      name: Dimensions
- id: suite_gongjulan_002_s1
  name: 工具栏-下一张按钮
  module: gongjulan
  steps:
  - step_type: action
    action: element_action
    selector:
      name: 下一张
    do: click
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gongjulan_013_s1
  name: OCR-入口检查-窗口下点击工具栏按钮
  module: gongjulan
  steps:
  - step_type: action
    action: element_action
    selector:
      name: 识别文字
    do: click
    wait: 2.0
  - step_type: assert
    action: assert_window
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_xuanzhuan_001_s1
  name: 全屏快捷键顺时针旋转
  module: 旋转
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
      role: item
    do: double_click
    wait: 1.0
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+R
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageViewer
      role: image viewer
  - step_type: assert
    action: assert_process_running
- id: suite_linglong_001_s1
  name: 玲珑应用基本功能-翻页浏览
  module: linglong
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
- id: suite_linglong_002_s1
  name: 玲珑应用基本功能-重命名
  module: linglong
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rename
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: Renamedialog
- id: suite_linglong_006_s1
  name: 运行玲珑应用
  module: linglong
  steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageViewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_用户场景_001_s1
  name: OCR识别长图成功-看图内OCR识别
  module: 用户场景
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Extract text
    wait: 2.0
  - step_type: assert
    action: assert_element
    selector:
      name: LiveTextWidget
- id: suite_用户场景_002_s1
  name: 视图切换放大旋转翻转-上下张切换
  module: 用户场景
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
- id: suite_jianshujiaohu_001_s1
  name: 快捷键Down缩小图片
  module: jianshujiaohu
  steps:
  - step_type: action
    action: keyboard_press
    key: down
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
- id: suite_jianshujiaohu_002_s1
  name: 快捷键Ctrl+-缩小图片
  module: jianshujiaohu
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+-
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
- id: suite_jianshujiaohu_003_s1
  name: 快捷键Ctrl+F9设置壁纸
  module: jianshujiaohu
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+f9
  - step_type: assert
    action: assert_process_running
- id: suite_jianshujiaohu_008_s1
  name: 鼠标滚轮缩放图片
  module: jianshujiaohu
  steps:
  - step_type: action
    action: mouse_scroll
    value: -3
  - step_type: action
    action: mouse_scroll
    value: 3
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
- id: suite_jianshujiaohu_011_s1
  name: 快捷键F1唤起帮助窗口
  module: jianshujiaohu
  steps:
  - step_type: action
    action: keyboard_press
    key: f1
  - step_type: assert
    action: assert_process_running
