  steps:
  - step_type: action
    action: mouse_right_click
    selector:
      name: Image view
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: down
  - step_type: action
    action: keyboard_press
    key: down
  - step_type: action
    action: keyboard_press
    key: return
    wait: 25.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: HighlightText
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
