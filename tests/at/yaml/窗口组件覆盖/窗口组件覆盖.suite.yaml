name: 窗口组件覆盖_suite
app: deepin-image-viewer
module: 窗口组件覆盖
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_window_001_s1
  name: 窗口组件元素覆盖验证
  description: 验证窗口骨架相关可访问元素存在
  steps: []
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_element
    selector:
      name: Toolbar
teardown:
- action: session_stop
