name: 玲珑应用_suite
app: deepin-image-viewer
module: 玲珑应用
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1705095_s1
  name: 玲珑应用基本功能测试
  description: 依次执行翻页、重命名、旋转、设为壁纸等基本功能，验证应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: f2
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rotate clockwise
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Set as wallpaper
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
