name: 复制_suite
app: deepin-image-viewer
module: 复制
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_fuzhi_001_s1
  name: 复制-右键菜单复制
  description: 右键图片选择复制，验证应用正常运行
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Copy
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_fuzhi_002_s1
  name: 复制-快捷键Ctrl+C
  description: 按Ctrl+C复制图片，验证应用正常运行
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+c
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
