name: 打印补充_suite
app: deepin-image-viewer
module: 打印补充
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_dayinbuchong_001_s1
  name: 打印预览-右键唤起打印
  description: 右键图片选择打印，验证图片视图存在且应用正常运行
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Print
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
