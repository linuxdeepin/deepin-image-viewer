name: 窗口_suite
app: deepin-image-viewer
module: 窗口
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652437_s1
  name: 窗口-ESC关闭看图窗口
  description: 按ESC键关闭看图窗口
  steps:
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
