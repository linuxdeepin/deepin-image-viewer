- id: suite_bianjimoshichangjing3_008_s1
  name: 编辑模式-删除标注对象验证
  description: 进入编辑模式后按Ctrl+Z撤销删除标注对象，验证编辑画布存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+z
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: EditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditToolbar
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
