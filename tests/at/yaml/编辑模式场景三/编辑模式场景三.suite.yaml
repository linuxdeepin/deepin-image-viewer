- id: suite_bianjimoshichangjing3_006_s1
  name: 编辑模式-文字标注输入验证
  description: 进入编辑模式在文本编辑器中输入文字标注，验证文本编辑器存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: TextEditor
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: 测试标注
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
  - step_type: assert
    action: assert_element
