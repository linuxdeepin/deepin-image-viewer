name: 编辑模式场景三_suite
app: deepin-image-viewer
module: 编辑模式场景三
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_bianjimoshichangjing3_001_s1
  name: 编辑模式-画笔工具选择与绘制验证
  description: 进入编辑模式选择画笔工具，验证编辑属性面板工具按钮和编辑画布存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: EditPropertyPanel_ToolButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: EditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditToolbar
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_bianjimoshichangjing3_002_s1
  name: 编辑模式-直线工具选择验证
  description: 进入编辑模式选择直线工具，验证编辑画布和工具栏存在
  steps:
