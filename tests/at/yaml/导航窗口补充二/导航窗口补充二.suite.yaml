name: 导航窗口补充二_suite
app: deepin-image-viewer
module: 导航窗口补充二
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_daohangchuangkoubuchong2_001_s1
  name: 导航窗口-移动显示区域
  description: 打开导航窗口后验证缩略图列表视图控件存在，应用正常运行
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+n
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ThumbnailListView
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_daohangchuangkoubuchong2_002_s1
  name: 导航窗口-关闭后验证图片视图
  description: 打开导航窗口后关闭，验证图片视图存在且应用正常运行
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+n
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_daohangchuangkoubuchong2_003_s1
  name: 导航窗口-按钮关闭导航窗口
  description: 打开导航窗口后点击关闭按钮，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+n
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Close navigation window
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
