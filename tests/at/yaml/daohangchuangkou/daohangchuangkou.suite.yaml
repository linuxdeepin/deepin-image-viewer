name: daohangchuangkou_suite
app: deepin-image-viewer
module: daohangchuangkou
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_daohangchuangkou_001_s1
  name: 导航窗口-缩略图切换图片
  description: 点击缩略图切换图片，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NormalThumbnailDelegate
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_daohangchuangkou_002_s1
  name: 导航窗口-关闭导航窗口
  description: 点击关闭导航窗口按钮，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Close navigation window
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
