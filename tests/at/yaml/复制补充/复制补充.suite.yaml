name: 复制补充_suite
app: deepin-image-viewer
module: 复制补充
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_fuzhibuchong_001_s1
  name: 复制-复制大分辨率图片
  description: 右键选择复制大分辨率图片，验证图片视图存在且应用正常运行
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Copy
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
