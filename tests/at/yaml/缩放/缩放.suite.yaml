name: 缩放_suite
app: deepin-image-viewer
module: 缩放
setup:
- action: session_start
  command: deepin-image-viewer
  wait: 3.0
suites:
- id: suite_suofang_001_s1
  name: ''
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    selector:
      name: Image view
    key: Down
    wait: 0.5
  - step_type: action
    action: keyboard_press
    selector:
      name: Image view
    key: Up
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_ocr_exists
    text: 2%
  - step_type: assert
    action: assert_ocr_exists
    text: 2000%
teardown:
- action: session_stop
