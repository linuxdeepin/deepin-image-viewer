name: 缩放_suite
app: deepin-image-viewer
module: 缩放
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652137_s1
  name: 缩放-最大放大倍数检查
  description: 持续按Up键放大图片至最大倍数，验证看图应用正常响应不崩溃
  steps:
  - step_type: action
    action: keyboard_press
    key: up
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: up
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: up
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: up
    wait: 0.3
