name: OCR_suite
app: deepin-image-viewer
module: OCR
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_ocr_001_s1
  name: OCR-点击识别文字按钮
  description: 点击工具栏识别文字按钮，验证OCR组件出现
  steps:
  - step_type: action
    action: element_action
    selector:
      name: 识别文字
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: LiveTextWidget
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_ocr_002_s1
  name: OCR-右键菜单识别文字
  description: 右键图片选择识别文字，验证OCR组件出现
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Extract text
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: LiveTextWidget
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
