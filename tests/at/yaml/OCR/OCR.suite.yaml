name: OCR_suite
app: deepin-image-viewer
module: OCR
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1651809_s1
  name: OCR-点击工具栏识别文字按钮
  description: 点击工具栏识别文字按钮，验证OCR结果展示
  steps:
  - step_type: action
    action: element_action
    selector:
      name: 识别文字
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: LiveTextWidget
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
