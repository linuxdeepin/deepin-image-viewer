name: 公共能力_suite
app: deepin-image-viewer
module: 公共能力
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_gonggongnengli_001_s1
  name: 公共能力-窗口属性验证
  description: 验证看图窗口标题栏、工具栏、图片视图等核心窗口属性控件存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Title bar
    do: click
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Title bar
  - step_type: assert
    action: assert_element
    selector:
      name: Toolbar
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gonggongnengli_002_s1
  name: 公共能力-工具栏多张图片验证
  description: 验证多张图片时工具栏包含上一张、下一张、适应窗口、原始尺寸等按钮
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Toolbar
  - step_type: assert
    action: assert_element
    selector:
      name: Next
  - step_type: assert
    action: assert_element
    selector:
      name: Previous
  - step_type: assert
    action: assert_element
    selector:
      name: Fit to window
  - step_type: assert
    action: assert_element
    selector:
      name: Original size
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gonggongnengli_003_s1
  name: 公共能力-右键菜单验证
  description: 右键图片验证右键菜单包含复制、重命名、删除、旋转等常用功能项
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Copy
    - Rename
    - Delete
    - Rotate clockwise
    - Rotate counterclockwise
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
