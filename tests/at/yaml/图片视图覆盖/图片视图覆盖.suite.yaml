name: 图片视图覆盖_suite
app: deepin-image-viewer
module: 图片视图覆盖
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 3.0
suites:
- id: suite_imgview_001_s1
  name: 图片视图元素覆盖验证
  description: 应用启动后验证图片视图相关元素存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageViewer_ViewDelegateLoader
  - step_type: assert
    action: assert_element
    selector:
      name: NormalImageDelegate
  - step_type: assert
    action: assert_element
    selector:
      name: NormalImageImageInput
  - step_type: assert
    action: assert_element
    selector:
      name: NormalImageSourceSizeOptimizer
  - step_type: assert
    action: assert_element
    selector:
      name: ImageAnimation
teardown:
- action: session_stop
