name: 导航窗口补充_suite
app: deepin-image-viewer
module: 导航窗口补充
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_daohangchuangkoubuchong_001_s1
  name: 导航窗口-关闭后再通过右键菜单唤起
  description: 先关闭导航窗口，再右键菜单重新唤起导航窗口，验证图片视图和缩略图列表存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Close navigation window
    do: click
    wait: 1.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Display in file manager
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
