name: 编辑模式效果_suite
app: deepin-image-viewer
module: 编辑模式效果
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_bianjimoshixiaoguo_001_s1
  name: 编辑模式-马赛克效果工具验证
  description: 进入编辑模式选择马赛克效果工具，验证编辑画布和属性面板存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: EditPropertyPanel_ToolButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: EditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditPropertyPanel
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_bianjimoshixiaoguo_002_s1
  name: 编辑模式-高斯模糊效果工具验证
  description: 进入编辑模式选择高斯模糊效果工具，验证编辑画布和工具栏存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: EditPropertyPanel_ToolButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: EditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditToolbar
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_bianjimoshixiaoguo_003_s1
  name: 编辑模式-涂鸦特效工具验证
  description: 进入编辑模式选择涂鸦特效工具，验证编辑画布和属性面板工具按钮存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: EditPropertyPanel_ToolButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: EditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditPropertyPanel_ToolButton
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
