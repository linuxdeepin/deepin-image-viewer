name: 全屏_suite
app: deepin-image-viewer
description: ''
module: 全屏
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652207_s1
  name: 启动看图应用
  description: ''
  tags: []
  steps:
  - action: mouse_double_click
    x: 500
    y: 400
    wait: 1.0
  - action: mouse_double_click
    x: 500
    y: 400
    wait: 1.0
  assert_steps:
  - action: assert_process_running
  - action: assert_process_running
- id: case_1652203_s1
  name: 启动看图应用
  description: ''
  tags: []
  steps:
  - action: keyboard_press
    key: f11
  - action: keyboard_press
    key: escape
  assert_steps:
  - action: assert_process_running
  - action: assert_process_running
- id: case_1652245_s1
  name: 旋转-全屏右键菜单逆时针旋转
  description: 双击进入全屏，右键选择逆时针旋转后ESC退出全屏
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: double_click
    wait: 1.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rotate counterclockwise
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652255_s1
  name: 旋转-全屏快捷键顺时针旋转
  description: 双击进入全屏，按Ctrl+R顺时针旋转后ESC退出全屏
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: double_click
    wait: 1.5
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+r
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
