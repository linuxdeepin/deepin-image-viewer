name: 全屏_suite
app: deepin-image-viewer
module: 全屏
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652207_s1
  name: 全屏-双击图片进入全屏模式
  description: 双击图片查看区域进入全屏，验证全屏视图展示
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: double_click
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageViewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652203_s1
  name: 全屏-快捷键F11进入与退出全屏
  description: 按F11进入全屏，再按F11退出全屏
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 1.5
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652199_s1
  name: 全屏-右键菜单退出全屏
  description: 进入全屏后通过右键菜单退出全屏
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 1.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Exit fullscreen
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652239_s1
  name: 全屏-全屏下右键菜单在文管中显示
  description: 进入全屏后右键唤起菜单选择在文件管理器中显示，验证菜单项可触发
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 1.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Display in file manager
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
