name: 用户场景_suite
app: deepin-image-viewer
module: 用户场景
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_用户场景_001_s1
  name: OCR识别长图成功-看图内OCR识别
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Extract text
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: LiveTextWidget
- id: suite_用户场景_002_s1
  name: 视图切换放大旋转翻转-上下张切换
  description: ''
  steps:
  - step_type: action
    action: keyboard_press
    key: escape
  - step_type: action
    action: keyboard_press
    key: right
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: left
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
teardown:
- action: session_stop
