name: 主菜单补充二_suite
app: deepin-image-viewer
module: 主菜单补充二
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_zhucaidanbuchong2_001_s1
  name: 主菜单-关于
  description: 点击标题栏菜单查看关于选项，验证标题栏菜单控件存在且应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Title bar
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: ViewTopTitleMenu
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ViewTopTitleMenu
  - step_type: assert
    action: assert_element
    selector:
      name: Title bar
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
