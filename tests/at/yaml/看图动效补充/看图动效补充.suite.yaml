name: 看图动效补充_suite
app: deepin-image-viewer
module: 看图动效补充
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_kantudongxiaobuchong_001_s1
  name: 看图动效-缩略图切换图片动效
  description: 通过缩略图列表切换图片验证图片动画控件存在，应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageAnimation
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_kantudongxiaobuchong_002_s1
  name: 看图动效-上一张切换动效
  description: 通过上一张按钮切换图片验证图片动画控件存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageAnimation
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_kantudongxiaobuchong_003_s1
  name: 看图动效-旋转后图片动效
  description: 旋转图片后验证图片动画控件存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+r
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ImageAnimation
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
