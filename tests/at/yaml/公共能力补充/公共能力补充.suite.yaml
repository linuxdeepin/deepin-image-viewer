name: 公共能力补充_suite
app: deepin-image-viewer
module: 公共能力补充
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_gonggongnenglibuchong_001_s1
  name: 公共能力-看图自有窗口属性
  description: 验证看图自有窗口标题栏和工具栏控件存在，应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Title bar
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Title bar
  - step_type: assert
    action: assert_element
    selector:
      name: Toolbar
  - step_type: assert
    action: assert_element
    selector:
      name: TitleRect
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gonggongnenglibuchong_002_s1
  name: 公共能力-看图工具栏单张图片检查
  description: 单张图片模式下检查工具栏各按钮齐全，验证工具栏和图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Toolbar
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gonggongnenglibuchong_003_s1
  name: 公共能力-看图工具栏多张图片检查
  description: 多张图片模式下检查工具栏各按钮齐全，验证工具栏和缩略图列表存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Toolbar
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gonggongnenglibuchong_004_s1
  name: 公共能力-看图右键菜单检查
  description: 右键图片验证右键菜单各功能项可用，验证图片视图存在
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Copy
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gonggongnenglibuchong_005_s1
  name: 公共能力-键盘交互检查
  description: 通过键盘快捷键操作图片，验证图片视图存在且应用运行
  steps:
  - step_type: action
    action: keyboard_press
    key: right
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: left
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
