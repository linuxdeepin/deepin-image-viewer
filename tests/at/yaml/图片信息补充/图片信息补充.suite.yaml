name: 图片信息补充_suite
app: deepin-image-viewer
module: 图片信息补充
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_tupianxinxibuchong_001_s1
  name: 图片信息-右键菜单打开图片信息
  description: 右键图片选择图片信息，验证属性信息视图控件存在且应用正常运行
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Image info
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: PropertyInfoView
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tupianxinxibuchong_002_s1
  name: 图片信息-工具栏切换图片展示
  description: 打开图片信息后通过工具栏切换下一张图片，验证图片视图和属性信息视图存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_element
    selector:
      name: PropertyInfoView
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tupianxinxibuchong_003_s1
  name: 图片信息-Ctrl+I快捷键打开
  description: 按Ctrl+I快捷键打开图片信息面板，验证属性信息视图存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: PropertyInfoView
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
