name: 删除场景_suite
app: deepin-image-viewer
module: 删除场景
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_shanchuchangjing_001_s1
  name: 删除-右键菜单删除后验证图片视图
  description: 右键图片选择删除后验证图片视图仍然存在且应用正常运行
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Delete
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_shanchuchangjing_002_s1
  name: 删除-删除后切换下一张图片
  description: 删除当前图片后点击下一张按钮切换，验证图片视图存在
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Delete
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_shanchuchangjing_003_s1
  name: 删除-删除后切换上一张图片
  description: 删除当前图片后点击上一张按钮切换，验证图片视图存在
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Delete
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
