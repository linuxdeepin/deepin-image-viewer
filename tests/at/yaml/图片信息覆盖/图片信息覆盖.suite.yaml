name: 图片信息覆盖_suite
app: deepin-image-viewer
module: 图片信息覆盖
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_info_001_s1
  name: 图片信息对话框元素覆盖验证
  description: 通过Ctrl+I打开图片信息对话框，验证基本信息页可访问元素存在（放末尾避免对话框残留影响后续用例）
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Basic info
  - step_type: assert
    action: assert_element
    selector:
      name: Details
  - step_type: assert
    action: assert_element
    selector:
      name: Dimensions
  - step_type: assert
    action: assert_element
    selector:
      name: Size
  - step_type: assert
    action: assert_element
    selector:
      name: Type
teardown:
- action: session_stop
