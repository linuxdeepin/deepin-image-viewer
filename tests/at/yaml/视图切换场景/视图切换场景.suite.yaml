name: 视图切换场景_suite
app: deepin-image-viewer
module: 视图切换场景
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_shituqiehuan_001_s1
  name: 视图切换-全屏旋转后退出全屏
  description: 进入全屏后右键顺时针旋转再退出全屏，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 2.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FullImageViewer
    items:
    - Rotate clockwise
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_shituqiehuan_002_s1
  name: 视图切换-放大旋转后适应窗口
  description: 放大图片后右键旋转再适应窗口，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl++
    wait: 0.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rotate counterclockwise
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Fit to window
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_shituqiehuan_003_s1
  name: 视图切换-全屏幻灯片后退出
  description: 进入全屏后启动幻灯片放映再ESC退出，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 2.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FullImageViewer
    items:
    - Slide show
    wait: 3.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_shituqiehuan_004_s1
  name: 视图切换-旋转后切换图片
  description: 右键旋转图片后点击下一张切换，验证图片视图和缩略图列表存在
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rotate clockwise
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_shituqiehuan_005_s1
  name: 视图切换-缩放后进入编辑模式
  description: 放大图片后进入编辑模式，验证编辑画布和工具栏存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl++
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageEditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditToolbar
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
