name: 重命名场景二_suite
app: deepin-image-viewer
module: 重命名场景二
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_chongmingmingchangjing2_001_s1
  name: 重命名-读写图片重命名
  description: 右键图片选择重命名输入新名称并确认，验证重命名对话框出现且应用运行
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rename
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: renamed_img.jpg
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: return
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_chongmingmingchangjing2_002_s1
  name: 重命名-只读图片重命名
  description: 尝试对只读图片进行重命名，验证重命名对话框出现且应用正常运行
  steps:
  - step_type: action
    action: keyboard_press
    key: f2
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: RenameDialog
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
