name: 幻灯片_suite
app: deepin-image-viewer
module: 幻灯片
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_huanjidengpian_001_s1
  name: 幻灯片-F5启动ESC退出
  description: 按F5启动幻灯片放映，按ESC退出
  steps:
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: esc
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_huanjidengpian_002_s1
  name: 幻灯片-右键菜单启动
  description: 右键图片选择幻灯片放映，ESC退出后验证应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: click
    wait: 0.5
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Slide show
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652159_s1
  name: 幻灯片-多张图片循环放映
  description: 按F5启动幻灯片放映，等待循环播放后ESC退出
  steps:
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 3.0
  - step_type: action
    action: keyboard_press
    key: esc
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652197_s1
  name: 幻灯片-ESC退出幻灯片放映
  description: 按F5启动幻灯片放映后按ESC退出，验证回到看图界面
  steps:
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: esc
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
