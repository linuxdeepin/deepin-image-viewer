name: 窗口关闭_suite
app: deepin-image-viewer
module: 窗口关闭
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_chuangkouguanbi_001_s1
  name: 关闭-窗口关闭按钮
  description: 验证窗口关闭按钮区域控件存在，应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Title bar
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Title bar
  - step_type: assert
    action: assert_element
    selector:
      name: TitleRect
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
