name: 编辑模式覆盖_suite
app: deepin-image-viewer
module: 编辑模式覆盖
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_edit_001_s1
  name: 编辑模式元素覆盖验证
  description: 进入编辑模式验证编辑工具栏可访问元素存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+e
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Edit toolbar
  - step_type: assert
    action: assert_element
    selector:
      name: Pen (P)
  - step_type: assert
    action: assert_element
    selector:
      name: Line (L)
  - step_type: assert
    action: assert_element
    selector:
      name: Arrow (A)
  - step_type: assert
    action: assert_element
    selector:
      name: Rect (R)
  - step_type: assert
    action: assert_element
    selector:
      name: Ellipse (C)
  - step_type: assert
    action: assert_element
    selector:
      name: Text (T)
  - step_type: assert
    action: assert_element
    selector:
      name: Blur (B)
  - step_type: assert
    action: assert_element
    selector:
      name: Crop (X)
  - step_type: assert
    action: assert_element
    selector:
      name: Undo (Ctrl+Z)
  - step_type: assert
    action: assert_element
    selector:
      name: Redo (Ctrl+Y)
  - step_type: assert
    action: assert_element
    selector:
      name: Save Copy
  - step_type: assert
    action: assert_element
    selector:
      name: Close Edit
  - step_type: action
    action: element_action
    selector:
      name: Close Edit
    do: click
    wait: 1.0
teardown:
- action: session_stop
