name: 编辑模式覆盖_suite
app: deepin-image-viewer
module: 编辑模式覆盖
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 3.0
suites:
- id: suite_edit_001_s1
  name: 编辑模式元素覆盖验证
  description: 进入编辑模式验证所有编辑相关元素存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+e
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageEditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditToolbar
teardown:
- action: session_stop
