name: tif多页图_suite
app: deepin-image-viewer
module: tif多页图
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_tifduoyetu_001_s1
  name: tif多页图-翻页浏览
  description: 点击下一张按钮翻页浏览，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tifduoyetu_002_s1
  name: tif多页图-幻灯片播放
  description: 按F5启动幻灯片，ESC退出，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: esc
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1651905_s1
  name: tif多页图-播放幻灯片
  description: 点击下一页按钮切换多页图，按F5播放幻灯片后双击退出
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: double_click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652039_s1
  name: tif多页图-缩略图切换图片
  description: 点击缩略图区域切换图片，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Image view
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: Image view
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652069_s1
  name: tif多页图-切换页后检查缩略
  description: 点击下一张按钮切换多页图页面，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652071_s1
  name: tif多页图-工具栏切换上一张图片
  description: 点击工具栏上一张按钮切换图片，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
