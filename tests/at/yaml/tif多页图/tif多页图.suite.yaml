name: tif多页图_suite
app: deepin-image-viewer
module: tif多页图
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_tifduoyetu_001_s1
  name: tif多页图-翻页浏览
  description: 点击下一张按钮翻页浏览，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tifduoyetu_002_s1
  name: tif多页图-幻灯片播放
  description: 按F5启动幻灯片，ESC退出，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f5
    wait: 2.0
  - step_type: action
    action: keyboard_press
    key: esc
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
