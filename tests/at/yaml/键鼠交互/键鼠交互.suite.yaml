name: 键鼠交互_suite
app: deepin-image-viewer
module: 键鼠交互
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652667_s1
  name: 键鼠交互-F11进入退出全屏
  description: 按F11进入全屏再按F11退出
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652645_s1
  name: 键鼠交互-F5播放幻灯片并退出
  description: 按F5播放幻灯片，ESC退出
