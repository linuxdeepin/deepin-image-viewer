name: 图片格式_suite
app: deepin-image-viewer
module: 图片格式
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652747_s1
  name: 图片格式-右键菜单检查
  description: 在图片查看区域右键唤起菜单，验证右键菜单各项正常展示
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Copy
    - Rename
    - Delete
    - Set as wallpaper
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652737_s1
  name: 图片格式-图片支持检查
  description: 打开图片后切换下一张再切回，验证不同格式图片均正常渲染展示
  steps:
  - step_type: action
    action: element_action
    selector:
      name: 下一张
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652745_s1
  name: 图片格式-支持旋转格式图片检查
  description: 打开BMP格式图片后点击旋转按钮，验证旋转操作正常执行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Rotate clockwise
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652741_s1
  name: 图片格式-支持设置壁纸格式图片检查
  description: 使用快捷键Ctrl+F9设置壁纸，验证壁纸设置操作可触发
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+f9
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
