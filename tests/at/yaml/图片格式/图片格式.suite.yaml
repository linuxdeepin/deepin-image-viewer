name: 图片格式_suite
app: deepin-image-viewer
module: 图片格式
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_tupiangeshi_001_s1
  name: 图片格式-图片支持检查
  description: 逐张切换图片检查图片是否均支持打开，验证图片视图和缩略图列表存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tupiangeshi_002_s1
  name: 图片格式-旋转后切换检查
  description: 旋转图片后切换下一张再切回，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+r
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
