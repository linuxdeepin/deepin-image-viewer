name: 图片格式_suite
app: deepin-image-viewer
module: 图片格式
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652737_s1
  name: 图片格式-图片支持检查
  description: 点击下一张切换图片，验证图片视图存在且应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652741_s1
  name: 图片格式-支持设置壁纸格式
  description: 按Ctrl+F9设置壁纸，验证应用正常运行
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+f9
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652745_s1
  name: 图片格式-支持旋转格式(bmp)
  description: 右键顺时针旋转后点击下一张切换，验证图片视图存在
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rotate clockwise
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652773_s1
  name: 格式支持-多格式图片浏览
  description: 点击下一张切换图片验证多格式支持，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
