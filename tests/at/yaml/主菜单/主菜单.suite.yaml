name: 主菜单_suite
app: deepin-image-viewer
module: 主菜单
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_zhucaidan_001_s1
  name: 主菜单-帮助
  description: 按F1打开帮助窗口，验证应用正常运行
  steps:
  - step_type: action
    action: keyboard_press
    key: f1
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652347_s1
  name: 主菜单-帮助
  description: 按F1打开帮助窗口，验证应用正常运行
  steps:
  - step_type: action
    action: keyboard_press
    key: f1
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652353_s1
  name: 主菜单-多窗口退出
  description: 按Ctrl+Q退出应用，验证进程关闭后可重新启动
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+q
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652359_s1
  name: 主菜单-关于与关闭后交互
  description: 点击标题栏后关闭窗口，验证应用进程状态
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Title bar
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    key: alt+f4
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
