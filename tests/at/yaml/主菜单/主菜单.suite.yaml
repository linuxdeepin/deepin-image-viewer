name: 主菜单_suite
app: deepin-image-viewer
module: 主菜单
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_2003949_s1
  name: 主菜单-点击主菜单按钮唤起菜单
  description: 点击右上角主菜单按钮，验证菜单展开
  steps:
  - step_type: action
    action: element_action
    selector:
      name: OptionMenu
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: OptionMenu
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652347_s1
  name: 主菜单-快捷键F1唤起帮助
  description: 按F1键唤起帮助窗口
  steps:
  - step_type: action
    action: keyboard_press
    key: f1
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652353_s1
  name: 主菜单-多窗口场景下主菜单可操作
  description: 验证主菜单按钮在多窗口场景下可正常点击
  steps:
  - step_type: action
    action: element_action
    selector:
      name: OptionMenu
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: OptionMenu
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652359_s1
  name: 主菜单-关闭窗口后重新启动看图
  description: 关闭看图窗口后重新启动，验证正常启动无残留弹窗
  steps:
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
