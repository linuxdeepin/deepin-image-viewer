name: 重命名_suite
app: deepin-image-viewer
module: 重命名
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_chongmingming_001_s1
  name: 重命名-快捷键F2重命名
  description: 按F2打开重命名对话框，输入新名称并确认
  steps:
  - step_type: action
    action: keyboard_press
    key: f2
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: test_rename
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: enter
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: RenameDialog
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_chongmingming_002_s1
  name: 重命名-右键菜单重命名
  description: 右键图片选择重命名，验证重命名对话框出现
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Rename
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Renamedialog
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
