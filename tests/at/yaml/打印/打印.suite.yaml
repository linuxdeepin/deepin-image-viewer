name: 打印_suite
app: deepin-image-viewer
module: 打印
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_dayin_001_s1
  name: 打印-右键菜单打印
  description: 右键图片键盘导航到打印菜单项后取消（避免拉起打印对话框干扰），验证菜单导航与进程存活
  steps:
  - step_type: action
    action: mouse_right_click
    selector:
      name: Image view
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: down
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652143_s1
  name: 打印预览-右键唤起打印
  description: 右键图片选择打印，键盘导航到打印项后取消（避免拉起打印对话框），验证进程存活
  steps:
  - step_type: action
    action: mouse_right_click
    selector:
      name: Image view
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: down
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
