name: 编辑模式子模式_suite
app: deepin-image-viewer
module: 编辑模式子模式
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_bianjimoshibzimoshi_001_s1
  name: 编辑模式-文本工具子模式切换记忆验证
  description: 进入编辑模式切换文本工具子模式后退出再进入，验证文本编辑器和编辑画布存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: TextEditor
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
  - step_type: assert
    action: assert_element
    selector:
      name: EditCanvas
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_bianjimoshibzimoshi_002_s1
  name: 编辑模式-模糊工具子模式切换记忆验证
  description: 进入编辑模式切换模糊工具子模式后退出再进入，验证编辑画布和属性面板存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: EditPropertyPanel_ToolButton
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: EditCanvas
  - step_type: assert
    action: assert_element
    selector:
      name: EditPropertyPanel
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
