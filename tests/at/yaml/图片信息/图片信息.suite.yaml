name: 图片信息_suite
app: deepin-image-viewer
module: 图片信息
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: case_1652225_s1
  name: 图片信息-Ctrl+I查看图片信息
  description: 按Ctrl+I查看图片信息，验证信息对话框展示
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Loader_InformationDialog
  - step_type: assert
    action: assert_element
    selector:
      name: Dimensions
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
