name: 图片信息_suite
app: deepin-image-viewer
module: 图片信息
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_tupianxinxi_001_s1
  name: 图片信息-快捷键Ctrl+I
  description: 按Ctrl+I打开图片信息对话框，验证信息对话框出现后按Ctrl+I关闭
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Basic info
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 1.0
- id: suite_tupianxinxi_002_s1
  name: 图片信息-右键菜单
  description: 右键图片选择图片信息，验证信息对话框出现
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Image info
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Basic info
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: case_1652225_s1
  name: 图片信息-工具栏切换图片展示
  description: 按Ctrl+I打开图片信息对话框，验证信息对话框出现后关闭
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Basic info
    app: deepin-image-viewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.5
teardown:
- action: session_stop
