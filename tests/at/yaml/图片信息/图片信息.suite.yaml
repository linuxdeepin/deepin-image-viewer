name: 图片信息_suite
app: deepin-image-viewer
module: 图片信息
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_tupianxinxi_001_s1
  name: 图片信息-快捷键Ctrl+I
  description: 按Ctrl+I打开图片信息对话框，验证信息对话框出现
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+i
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Loader_InformationDialog
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tupianxinxi_002_s1
  name: 图片信息-右键菜单
  description: 右键图片选择图片信息，验证信息对话框出现
  steps:
  - step_type: action
    action: dtk_context_menu
    selector:
      name: Image view
    items:
    - Image info
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Loader_InformationDialog
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
