name: tif多页图补充_suite
app: deepin-image-viewer
module: tif多页图补充
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_tifduoyetubuchong_001_s1
  name: tif多页图-缩略图切换图片
  description: 通过缩略图列表切换tif多页图，验证缩略图列表和图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: BottomthumbnaillistView
    do: click
    wait: 1.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tifduoyetubuchong_002_s1
  name: tif多页图-切换页后检查缩略图
  description: 切换tif多页图页面后检查缩略图列表存在，验证应用正常运行
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_tifduoyetubuchong_003_s1
  name: tif多页图-工具栏切换上一张图片
  description: 通过工具栏上一张按钮切换tif多页图，验证图片视图和工具栏存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_element
    selector:
      name: Toolbar
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
