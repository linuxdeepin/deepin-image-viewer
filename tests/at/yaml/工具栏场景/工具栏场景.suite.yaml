name: 工具栏场景_suite
app: deepin-image-viewer
module: 工具栏场景
setup:
- action: session_start
  command: tests/at/launch.sh
  wait: 7.0
suites:
- id: suite_gongjulanchangjing_001_s1
  name: 工具栏-编辑按钮进入编辑模式
  description: 点击工具栏编辑按钮进入编辑模式，验证编辑工具栏出现
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Edit
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: EditToolbar
  - step_type: assert
    action: assert_element
    selector:
      name: EditPropertyPanel
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gongjulanchangjing_002_s1
  name: 工具栏-全屏后工具栏显示验证
  description: 按F11进入全屏后验证工具栏缩略图列表视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageViewer
  - step_type: assert
    action: assert_element
    selector:
      name: BottomthumbnaillistView
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gongjulanchangjing_003_s1
  name: 工具栏-全屏下使用下一张按钮
  description: 全屏模式下点击下一张按钮切换图片，验证全屏视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Next
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageViewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gongjulanchangjing_004_s1
  name: 工具栏-全屏下使用上一张按钮
  description: 全屏模式下点击上一张按钮切换图片，验证全屏视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: Previous
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FullImageViewer
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gongjulanchangjing_005_s1
  name: 工具栏-适应窗口后切换原始尺寸
  description: 点击适应窗口后切换到原始尺寸，验证图片视图存在
  steps:
  - step_type: action
    action: element_action
    selector:
      name: Fit to window
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: Original size
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
- id: suite_gongjulanchangjing_006_s1
  name: 工具栏-全屏下旋转后退出全屏
  description: 全屏下右键旋转图片后按ESC退出全屏，验证图片视图存在
  steps:
  - step_type: action
    action: keyboard_press
    key: f11
    wait: 2.0
  - step_type: action
    action: dtk_context_menu
    selector:
      name: FullImageViewer
    items:
    - Rotate clockwise
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Image view
  - step_type: assert
    action: assert_process_running
    app: deepin-image-viewer
teardown:
- action: session_stop
